[project]
name = "industrial-data-agent"
version = "0.1.0"
description = "CLI-only Gemini-backed industrial data agent with validated sandbox execution."
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.0.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "rich>=13.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "python-dateutil>=2.8",
  "matplotlib>=3.7",
  "reportlab>=4.0",
  "openpyxl>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
